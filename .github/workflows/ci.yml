name: Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate infrastructure code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "ansible-lint==26.6.0" \
            "yamllint==1.38.0"

      - name: Install Ansible collection
        run: ansible-galaxy collection install community.general

      - name: Check YAML files
        run: >-
          yamllint
          -d "{extends: relaxed, rules: {line-length: disable}}"
          ansible/site.yml
          uptime-kuma/compose.yaml

      - name: Check Ansible syntax
        run: >-
          ansible-playbook
          -i ansible/inventory.ini
          ansible/site.yml
          --syntax-check

      - name: Run minimal Ansible lint
        run: ansible-lint --profile min ansible/site.yml

      - name: Check Docker Compose file
        run: docker compose -f uptime-kuma/compose.yaml config --quiet

      - name: Check Vagrantfile Ruby syntax
        run: ruby -c Vagrantfile