---
name: Infrastructure CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate infrastructure code
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-lint==26.6.0 yamllint==1.38.0
          ansible-galaxy collection install community.general

      - name: Check YAML formatting
        run: |
          yamllint \
            -d '{extends: relaxed, rules: {line-length: disable}}' \
            ansible uptime-kuma/compose.yaml

      - name: Check Ansible syntax
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/site.yml \
            --syntax-check
          ansible-playbook \
            -i localhost, \
            ansible/controller.yml \
            --syntax-check

      - name: Lint Ansible playbooks
        run: |
          ansible-lint --profile min \
            ansible/site.yml \
            ansible/controller.yml

      - name: Check Terraform formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialize Terraform
        run: terraform -chdir=terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Validate Docker Compose
        run: docker compose -f uptime-kuma/compose.yaml config --quiet

      - name: Validate Vagrantfile syntax
        run: ruby -c Vagrantfile
