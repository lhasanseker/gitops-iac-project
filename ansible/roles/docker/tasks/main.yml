---
- name: Docker | APT anahtar klasoru mevcut olsun
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker | Resmi imza anahtarini indir
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  notify: Docker | Paket listesini yenile

- name: Docker | Resmi paket deposunu ekle
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: "0644"
  notify: Docker | Paket listesini yenile

- name: Docker | Bekleyen paket listesi yenilemesini calistir
  ansible.builtin.meta: flush_handlers

- name: Docker | Paketleri kurulu olsun
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Docker | Servisi calisiyor olsun
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Docker | Vagrant kullanicisi Docker grubunda olsun
  ansible.builtin.user:
    name: vagrant
    groups:
      - docker
    append: true
