---
- name: Sunucuyu Docker icin hazirla
  hosts: servers
  become: true
  gather_facts: true

  vars:
    docker_apt_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(
        ansible_facts["architecture"],
        ansible_facts["architecture"]
      ) }}

  tasks:
    - name: Kalici DNS servisini olustur
      ansible.builtin.copy:
        dest: /etc/systemd/system/gitops-dns.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=GitOps VM DNS ayari
          Wants=network-online.target
          After=network-online.target systemd-resolved.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/resolvectl dns {{ ansible_facts["default_ipv4"]["interface"] }} 1.1.1.1 8.8.8.8
          ExecStart=/usr/bin/resolvectl domain {{ ansible_facts["default_ipv4"]["interface"] }} ~.
          ExecStart=/usr/bin/resolvectl flush-caches
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      register: dns_service_file
    - name: Kalici DNS servisini etkinlestir ve uygula
      ansible.builtin.systemd_service:
        name: gitops-dns.service
        enabled: true
        daemon_reload: true
        state: "{{ dns_service_file.changed | ternary('restarted', 'started') }}"

    - name: SSH servisi etkin ve calisiyor olsun
      ansible.builtin.systemd_service:
        name: ssh
        state: started
        enabled: true

    - name: Ubuntu paket listesini guncelle
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Temel paketler kurulu olsun
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - git
          - gnupg
          - unzip
        state: present

    - name: APT anahtar klasoru mevcut olsun
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Docker resmi imza anahtarini indir
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"
      notify: Docker paket listesini yenile

    - name: Docker resmi paket deposunu ekle
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.sources
        owner: root
        group: root
        mode: "0644"
        content: |
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: {{ ansible_facts["distribution_release"] }}
          Components: stable
          Architectures: {{ docker_apt_arch }}
          Signed-By: /etc/apt/keyrings/docker.asc
      notify: Docker paket listesini yenile

    - name: Bekleyen paket listesi yenilemesini calistir
      ansible.builtin.meta: flush_handlers

    - name: Docker paketleri kurulu olsun
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Docker servisi calisiyor olsun
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

    - name: Vagrant kullanicisi Docker grubunda olsun
      ansible.builtin.user:
        name: vagrant
        groups:
          - docker
        append: true
    - name: Nginx kurulu olsun
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Nginx ana sayfasini olustur
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="tr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>GitOps ve IaC Sunucusu</title>
            <style>
              body {
                background: #111827;
                color: #f9fafb;
                font-family: Arial, sans-serif;
                display: grid;
                min-height: 100vh;
                place-items: center;
                margin: 0;
              }

              .card {
                background: #1f2937;
                border: 1px solid #374151;
                border-radius: 16px;
                padding: 36px;
                max-width: 620px;
                box-shadow: 0 20px 50px #0006;
              }

              h1 {
                color: #34d399;
              }

              li {
                margin: 10px 0;
              }
            </style>
          </head>
          <body>
            <main class="card">
              <h1>GitOps ve IaC Sunucusu Calisiyor</h1>
              <p>Bu sayfa Ansible tarafindan otomatik olusturuldu.</p>
              <ul>
                <li>Ubuntu: Hazir</li>
                <li>Docker: Kurulu</li>
                <li>Nginx: Aktif</li>
                <li>Altyapi: Kod ile yonetiliyor</li>
              </ul>
            </main>
          </body>
          </html>

    - name: Nginx yapilandirmasini kontrol et
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Nginx servisi calisiyor olsun
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true
    - name: Guvenlik paketleri kurulu olsun
      ansible.builtin.apt:
        name:
          - ufw
          - fail2ban
          - unattended-upgrades
          - python3-systemd
        state: present

    - name: SSH portuna izin ver
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: HTTP portuna izin ver
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Gelen diger baglantilari reddet
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Giden baglantilara izin ver
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: UFW guvenlik duvari aktif olsun
      community.general.ufw:
        state: enabled

    - name: SSH icin Fail2ban ayarini olustur
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.d/sshd.local
        owner: root
        group: root
        mode: "0644"
        content: |
          [sshd]
          enabled = true
          backend = systemd
          port = ssh
          maxretry = 5
          findtime = 10m
          bantime = 1h
      notify: Fail2ban servisini yeniden baslat

    - name: Fail2ban servisi calisiyor olsun
      ansible.builtin.systemd_service:
        name: fail2ban
        state: started
        enabled: true

    - name: Otomatik guvenlik guncellemelerini etkinlestir
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Otomatik guncelleme servisi etkin olsun
      ansible.builtin.systemd_service:
        name: unattended-upgrades
        state: started
        enabled: true
    - name: Uptime Kuma uygulama klasoru mevcut olsun
      ansible.builtin.file:
        path: /opt/uptime-kuma
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Uptime Kuma Compose dosyasini sunucuya kopyala
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../uptime-kuma/compose.yaml"
        dest: /opt/uptime-kuma/compose.yaml
        owner: root
        group: root
        mode: "0644"

    - name: Uptime Kuma Docker volume durumunu kontrol et
      ansible.builtin.command:
        cmd: docker volume inspect uptime-kuma-data
      register: kuma_volume
      failed_when: false
      changed_when: false

    - name: Uptime Kuma Docker volume olustur
      ansible.builtin.command:
        cmd: docker volume create uptime-kuma-data
      when: kuma_volume.rc != 0

    - name: Windows tarafinda eski yedek var mi kontrol et
      ansible.builtin.stat:
        path: /mnt/uptime-kuma-backups/uptime-kuma-latest.tar.gz
      register: kuma_backup

    - name: Uptime Kuma volume bos mu kontrol et
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v uptime-kuma-data:/data:ro
          alpine:3.22
          sh -c 'test -n "$(find /data -mindepth 1 -print -quit)"'
      register: kuma_volume_content
      failed_when: kuma_volume_content.rc not in [0, 1]
      changed_when: false

    - name: Eski Uptime Kuma yedegini geri yukle
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          -v uptime-kuma-data:/restore
          -v /mnt/uptime-kuma-backups:/backup:ro
          alpine:3.22
          sh -c
          'tar xzf /backup/uptime-kuma-latest.tar.gz -C /restore'
      when:
        - kuma_volume_content.rc == 1
        - kuma_backup.stat.exists

    - name: Uptime Kuma Docker image mevcut mu kontrol et
      ansible.builtin.command:
        cmd: docker image inspect louislam/uptime-kuma:2.5.0
      register: kuma_image
      failed_when: false
      changed_when: false

    - name: Uptime Kuma Docker image otomatik indir
      ansible.builtin.command:
        cmd: timeout 900 docker pull louislam/uptime-kuma:2.5.0
      register: kuma_image_pull
      until: kuma_image_pull.rc == 0
      retries: 5
      delay: 20
      when: kuma_image.rc != 0

    - name: Uptime Kuma Docker image calisabilir mi kontrol et
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --entrypoint /usr/bin/dumb-init
          louislam/uptime-kuma:2.5.0
          --version
      register: kuma_image_validation
      failed_when: false
      changed_when: false

    - name: Bozuk image kullanan containeri kaldir
      ansible.builtin.command:
        cmd: docker compose down
        chdir: /opt/uptime-kuma
      when: kuma_image_validation.rc != 0

    - name: Bozuk Uptime Kuma image dosyasini sil
      ansible.builtin.command:
        cmd: docker image rm -f louislam/uptime-kuma:2.5.0
      when: kuma_image_validation.rc != 0

    - name: Uptime Kuma Docker image dosyasini yeniden indir
      ansible.builtin.command:
        cmd: timeout 900 docker pull louislam/uptime-kuma:2.5.0
      register: kuma_image_repull
      until: kuma_image_repull.rc == 0
      retries: 5
      delay: 20
      when: kuma_image_validation.rc != 0

    - name: Uptime Kuma Docker image son kontrolunu yap
      ansible.builtin.command:
        cmd: >-
          docker run --rm
          --entrypoint /usr/bin/dumb-init
          louislam/uptime-kuma:2.5.0
          --version
      register: kuma_image_final_validation
      changed_when: false
      failed_when: kuma_image_final_validation.rc != 0

    - name: Uptime Kuma containerini calistir
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: /opt/uptime-kuma
      until: kuma_compose.rc == 0
      retries: 3
      delay: 10
      register: kuma_compose
      changed_when: >-
        'Created' in kuma_compose_output or
        'Started' in kuma_compose_output or
        'Recreated' in kuma_compose_output or
        'Pulled' in kuma_compose_output
      vars:
        kuma_compose_output: >-
          {{ kuma_compose.stdout | default('') }}
          {{ kuma_compose.stderr | default('') }}

    - name: Uptime Kuma hazir olana kadar bekle
      ansible.builtin.uri:
        url: http://127.0.0.1:3001
        status_code:
          - 200
          - 302
      register: kuma_http
      until: kuma_http.status in [200, 302]
      retries: 30
      delay: 5

    - name: Uptime Kuma yedekleme scriptini olustur
      ansible.builtin.copy:
        dest: /usr/local/sbin/backup-uptime-kuma
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          set -Eeuo pipefail

          CONTAINER="uptime-kuma"
          VOLUME="uptime-kuma-data"
          BACKUP_DIR="/mnt/uptime-kuma-backups"
          TEMP_BACKUP="${BACKUP_DIR}/uptime-kuma-backup.tmp.tar.gz"
          FINAL_BACKUP="${BACKUP_DIR}/uptime-kuma-latest.tar.gz"

          docker volume inspect "${VOLUME}" >/dev/null

          if [ ! -d "${BACKUP_DIR}" ]; then
            echo "Yedek klasoru bulunamadi: ${BACKUP_DIR}"
            exit 1
          fi

          WAS_RUNNING="false"

          if docker ps --quiet \
            --filter "name=^/${CONTAINER}$" | grep -q .; then
            WAS_RUNNING="true"
            docker stop --time 30 "${CONTAINER}"
          fi

          restart_container() {
            if [ "${WAS_RUNNING}" = "true" ]; then
              docker start "${CONTAINER}" >/dev/null
            fi
          }

          trap restart_container EXIT

          docker run --rm \
            -v "${VOLUME}:/source:ro" \
            -v "${BACKUP_DIR}:/backup" \
            alpine:3.22 \
            sh -c \
            'tar czf /backup/uptime-kuma-backup.tmp.tar.gz -C /source .'

          mv -f "${TEMP_BACKUP}" "${FINAL_BACKUP}"
          date -Is > "${BACKUP_DIR}/uptime-kuma-latest.txt"

          echo "Uptime Kuma yedegi olusturuldu: ${FINAL_BACKUP}"
      notify: Uptime Kuma yedek zamanlayicisini yeniden baslat

    - name: Uptime Kuma yedek servis dosyasini olustur
      ansible.builtin.copy:
        dest: /etc/systemd/system/uptime-kuma-backup.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Uptime Kuma veri yedegi
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/backup-uptime-kuma
      notify: Uptime Kuma yedek zamanlayicisini yeniden baslat

    - name: Uptime Kuma yedek zamanlayici dosyasini olustur
      ansible.builtin.copy:
        dest: /etc/systemd/system/uptime-kuma-backup.timer
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Uptime Kuma verisini duzenli yedekle

          [Timer]
          OnCalendar=*-*-* 00,06,12,18:00:00
          RandomizedDelaySec=5m
          Persistent=true

          [Install]
          WantedBy=timers.target
      notify: Uptime Kuma yedek zamanlayicisini yeniden baslat

    - name: Nginx Uptime Kuma reverse proxy ayarini olustur
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: "0644"
        content: |
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;

                  proxy_read_timeout 86400;
                  proxy_cache_bypass $http_upgrade;
              }
          }
      notify: Nginx yapilandirmasini yeniden yukle

    - name: Nginx yapilandirmasini kontrol et
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false

    - name: Bekleyen handler islemlerini calistir
      ansible.builtin.meta: flush_handlers

    - name: Nginx uzerinden Uptime Kuma erisimini kontrol et
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code:
          - 200
          - 302

    - name: Uptime Kuma yedek zamanlayicisi aktif olsun
      ansible.builtin.systemd_service:
        name: uptime-kuma-backup.timer
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Docker paket listesini yenile
      ansible.builtin.apt:
        update_cache: true

    - name: Fail2ban servisini yeniden baslat
      ansible.builtin.systemd_service:
        name: fail2ban
        state: restarted

    - name: Nginx yapilandirmasini yeniden yukle
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded

    - name: Uptime Kuma yedek zamanlayicisini yeniden baslat
      ansible.builtin.systemd_service:
        name: uptime-kuma-backup.timer
        state: restarted
        enabled: true
        daemon_reload: true